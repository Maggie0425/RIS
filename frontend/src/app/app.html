<main>
  <h1>COMP3888 Radiology Information System</h1>
  <p>Minimum full-stack connection check</p>

  @if (loading()) {
    <mat-spinner diameter="36" aria-label="Loading system status" />
  } @else if (error()) {
    <mat-card appearance="outlined" class="error">
      <mat-card-content>{{ error() }}</mat-card-content>
    </mat-card>
  } @else {
    @for (status of statuses(); track status.id) {
      <mat-card appearance="outlined">
        <mat-card-header>
          <mat-card-title>{{ status.serviceName }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>{{ status.message }}</mat-card-content>
      </mat-card>
    }
  }
</main>
