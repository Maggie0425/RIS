spring.application.name=ris-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ris}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ris}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ris_dev_password}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

ris.security.jwt.secret=${RIS_JWT_SECRET:}
ris.security.jwt.issuer=${RIS_JWT_ISSUER:ris-backend}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
