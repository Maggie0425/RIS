name: ris

services:
  postgres:
    image: postgres:17-alpine
    container_name: ris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ris}
      POSTGRES_USER: ${POSTGRES_USER:-ris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ris_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ris-postgres-data:/var/lib/postgresql/data
      - ./ris-infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
    container_name: ris-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ris}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-ris}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-ris_dev_password}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ris-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@ris.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-ris_pgadmin_password}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - ris-pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ris-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ris-postgres-data:
  ris-pgadmin-data:
