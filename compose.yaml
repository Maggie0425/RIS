name: ris

services:
  postgres:
    image: postgres:17-alpine
    container_name: ris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ris}
      POSTGRES_USER: ${POSTGRES_USER:-ris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ris_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ris-postgres-data:/var/lib/postgresql/data
      - ./ris-infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Add the backend service after backend/Dockerfile exists.
  # backend:
